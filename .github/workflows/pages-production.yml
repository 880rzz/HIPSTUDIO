name: Deploy HIPStudio production to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-HIPSTUDIO to confirm a production deployment attempt'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hipstudio-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit confirmation
        run: test "${{ inputs.confirm }}" = "DEPLOY-HIPSTUDIO"
      - name: Enforce release gates
        run: python3 tools/assert_production_activation.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production candidate
        env:
          BUILD_MODE: production
          PLATFORM_URL: https://www.hipstudio.hu
          QUOTE_REQUEST_BASE_URL: https://www.hipstudio.hu
          QUOTE_FORM_ENDPOINT: ${{ vars.QUOTE_FORM_ENDPOINT }}
        run: npm run build:all
      - run: npm run test:all
      - run: npm run test:html
      - name: Set custom domain marker
        run: printf '%s\n' 'www.hipstudio.hu' > dist-platform/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-platform
      - id: deployment
        uses: actions/deploy-pages@v4
