name: Publish HIPStudio production to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hipstudio-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the approved production custom domain
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_CUSTOM_DOMAIN: www.hipstudio.hu
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$status" != "200" ]; then
            echo "Production deployment blocked: could not verify GitHub Pages configuration (HTTP $status)." >&2
            cat /tmp/pages.json >&2 || true
            exit 1
          fi
          cname="$(python3 -c "import json; print((json.load(open('/tmp/pages.json')).get('cname') or '').strip())")"
          if [ "$cname" != "$PRODUCTION_CUSTOM_DOMAIN" ]; then
            echo "Production deployment blocked: expected $PRODUCTION_CUSTOM_DOMAIN, found ${cname:-<none>}." >&2
            exit 1
          fi
          echo "Production custom domain verified: $PRODUCTION_CUSTOM_DOMAIN"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate review-safe build before production
        env:
          BUILD_MODE: review
          PLATFORM_URL: https://www.hipstudio.hu
          QUOTE_REQUEST_BASE_URL: https://www.hipstudio.hu
        run: |
          npm run build:platform
          npm run test:platform
          npm run test:pain-points
          npm run test:privacy-governance
          npm run test:privacy-pages
          npm run test:hosting
          npm run test:html
      - name: Require live quote backend secret
        env:
          QUOTE_FORM_ENDPOINT: ${{ secrets.QUOTE_FORM_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "$QUOTE_FORM_ENDPOINT" ]; then
            echo "Production deployment blocked: GitHub secret QUOTE_FORM_ENDPOINT is missing." >&2
            exit 1
          fi
          case "$QUOTE_FORM_ENDPOINT" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "Production deployment blocked: QUOTE_FORM_ENDPOINT is not a deployed Google Apps Script /exec URL." >&2; exit 1 ;;
          esac
      - name: Build production HIPStudio site
        env:
          BUILD_MODE: production
          PLATFORM_URL: https://www.hipstudio.hu
          QUOTE_REQUEST_BASE_URL: https://www.hipstudio.hu
          PLATFORM_PUBLICATION_APPROVED: '1'
          PRODUCTION_CUTOVER_APPROVED: '1'
          QUOTE_FORM_ENDPOINT: ${{ secrets.QUOTE_FORM_ENDPOINT }}
        run: npm run build:platform
      - run: npm run test:html
      - name: Prepare www.hipstudio.hu production artifact
        run: python3 tools/prepare_pages_production.py
      - name: Validate www.hipstudio.hu production artifact
        run: python3 tools/test_pages_production_artifact.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages-production
      - id: deployment
        uses: actions/deploy-pages@v4
