name: Validate unpublished migration and unified platform
on:
  push:
    branches: [main, codex/hipstudio-static-migration, feat/unified-business-platform, feat/unified-content-migration, feat/hipstudio-master-brand, feat/commercial-content-deepening, feat/flagship-solution-deepening, feat/evidence-reference-layer, feat/legacy-url-migration-matrix, feat/business-provider-responsibility-matrix, feat/production-readiness-hardening, feat/legal-controller-and-retired-hello, fix/controller-hipstudio-kft]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm test
      - run: npm run test:platform
      - run: npm run test:master-brand
      - run: npm run test:domain-migration
      - run: npm run test:legacy-url-matrix
      - run: npm run test:commercial-content
      - run: npm run test:solution-depth
      - run: npm run test:evidence
      - run: npm run test:business-provider
      - run: npm run test:release-gates
      - run: npm run test:legal-controller
      - run: npm run test:privacy-governance
      - run: npm run test:privacy-pages
      - run: npm run test:hosting
      - run: npm run test:service-inventory
      - run: npm run test:public-quote
      - run: npm run test:quote-routing
      - run: npm run test:quote-email-localization
      - run: npm run test:no-wix-hotlinks
      - run: npm run test:partner-references
      - run: npm run test:flugos-sponsors
      - run: npm run test:hero-media
      - run: npm run test:experience-shell
      - run: npm run test:pricing
      - run: npm run test:html
      - name: Prepare GitHub Pages review artifact
        run: python3 tools/prepare_pages_review.py
      - name: Validate GitHub Pages review artifact
        run: python3 tools/test_pages_review_artifact.py
      - run: npx playwright install --with-deps chromium
      - name: Start GitHub Pages project-path simulator
        run: |
          rm -rf pages-review-root
          mkdir -p pages-review-root
          cp -a dist-pages-review pages-review-root/HIPSTUDIO
          nohup python3 -m http.server 4175 --bind 127.0.0.1 --directory pages-review-root >/tmp/pages-review.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4175/HIPSTUDIO/hu/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pages-review.log
          exit 1
      - name: Browser-test GitHub Pages review artifact
        run: node tools/browser-pages-review-qa.mjs
      - name: Start local HIPStudio review server
        run: |
          nohup npm run preview >/tmp/hipstudio-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/hu/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hipstudio-preview.log
          exit 1
      - run: npm run test:browser
      - name: Start local unified platform review server
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-platform >/tmp/platform-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4174/hu/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/platform-preview.log
          exit 1
      - run: npm run test:browser:platform
      - name: Upload platform browser QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-platform-qa
          path: audit/browser-platform-qa.json
          if-no-files-found: error
