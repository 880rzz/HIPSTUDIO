name: Validate unpublished migration
on:
  push:
    branches: [codex/hipstudio-static-migration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: node tools/test-pricing.mjs
