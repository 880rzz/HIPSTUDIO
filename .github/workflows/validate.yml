name: Validate unpublished migration and unified platform
on:
  push:
    branches: [codex/hipstudio-static-migration, feat/unified-business-platform, feat/unified-content-migration, feat/hipstudio-master-brand, feat/commercial-content-deepening]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm test
      - run: npm run test:platform
      - run: npm run test:master-brand
      - run: npm run test:domain-migration
      - run: npm run test:commercial-content
      - run: npm run test:service-inventory
      - run: npm run test:public-quote
      - run: npm run test:quote-routing
      - run: npm run test:pricing
      - run: npm run test:html
      - run: npx playwright install --with-deps chromium
      - name: Start local HIPStudio review server
        run: |
          nohup npm run preview >/tmp/hipstudio-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/hu/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hipstudio-preview.log
          exit 1
      - run: npm run test:browser
      - name: Start local unified platform review server
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-platform >/tmp/platform-preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4174/hu/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-preview.log
          exit 1
      - run: npm run test:browser:platform
